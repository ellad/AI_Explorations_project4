<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Ferris Wheel Animation</title><style>body{background:#191422;color:#ead9c6;font-family:system-ui,sans-serif;text-align:center;margin:0;padding:20px}canvas{width:min(95vw,650px);height:auto;background:radial-gradient(ellipse at center,#3d2a40,#1a1621);border-radius:18px}button{padding:12px 20px;margin:12px;background:#946d60;color:white;border:0;border-radius:8px;cursor:pointer}p{max-width:650px;margin:12px auto;color:#cbb9b6}</style><h2>Halloween Ferris Wheel · Independent upright carts</h2><canvas id="view" width="900" height="900"></canvas><div><button id="toggle">Pause</button></div><p>Each cart is a separate transparent PNG. Wheel rotation and cart positions are calculated independently so the gondolas remain upright.</p><script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');const imgs=[];for(let i=1;i<=8;i++){const im=new Image();im.src=`cart_position_${String(i).padStart(2,'0')}.png`;imgs.push(im)}let angle=0,run=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=null;const cx=450,cy=420,R=275;function draw(t){if(last!==null&&run)angle+=(t-last)*Math.PI*2/36000;last=t;ctx.clearRect(0,0,900,900);ctx.strokeStyle='#765968';ctx.lineWidth=28;ctx.beginPath();ctx.moveTo(320,820);ctx.lineTo(cx,cy);ctx.lineTo(580,820);ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.strokeStyle='#6d5066';ctx.lineWidth=25;ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#aa7e59';ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#725767';ctx.lineWidth=11;for(let i=0;i<12;i++){let a=i*Math.PI/6;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R);ctx.stroke()}ctx.restore();imgs.forEach((img,i)=>{let a=i*Math.PI/4-Math.PI/2+angle,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);if(img.complete&&img.naturalWidth)ctx.drawImage(img,x-76,y-30,152,203)});ctx.beginPath();ctx.arc(cx,cy,25,0,Math.PI*2);ctx.fillStyle='#493645';ctx.fill();ctx.strokeStyle='#cda16a';ctx.lineWidth=7;ctx.stroke();requestAnimationFrame(draw)}requestAnimationFrame(draw);let btn=document.getElementById('toggle');btn.textContent=run?'Pause':'Play';btn.onclick=()=>{run=!run;btn.textContent=run?'Pause':'Play'};</script></html>
