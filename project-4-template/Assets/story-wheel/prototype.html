<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ferris wheel motion prototype</title><link rel="stylesheet" href="prototype.css"></head><body><main class="prototype">
<img class="background" src="wheel-background-clean-v1.png" alt="An unlit abandoned fairground midway"><img class="support" src="wheel-support-v1.png" alt="">
<div class="rotor" id="rotor" role="img" aria-label="A weathered Ferris wheel with ten hanging carriages"><img class="wheel-frame" src="wheel-frame-v1.png" alt="">
<div class="carriage-arm" style="--slot:0"><img src="wheel-carriage-v1.png" alt=""></div><div class="carriage-arm" style="--slot:1"><img src="wheel-carriage-v1.png" alt=""></div><div class="carriage-arm" style="--slot:2"><img src="wheel-carriage-v1.png" alt=""></div><div class="carriage-arm" style="--slot:3"><img src="wheel-carriage-v1.png" alt=""></div><div class="carriage-arm" style="--slot:4"><img src="wheel-carriage-v1.png" alt=""></div><div class="carriage-arm" style="--slot:5"><img src="wheel-carriage-v1.png" alt=""></div><div class="carriage-arm" style="--slot:6"><img src="wheel-carriage-v1.png" alt=""></div><div class="carriage-arm" style="--slot:7"><img src="wheel-carriage-v1.png" alt=""></div><div class="carriage-arm" style="--slot:8"><img src="wheel-carriage-v1.png" alt=""></div><div class="carriage-arm" style="--slot:9"><img src="wheel-carriage-v1.png" alt=""></div></div>
<img class="foreground foreground-left" src="wheel-background-clean-v1.png" alt=""><img class="foreground foreground-right" src="wheel-background-clean-v1.png" alt=""><section class="controls" aria-label="Prototype controls"><button id="start" type="button">Start wheel</button><button id="pause" type="button" disabled>Pause</button><label><input id="reduce" type="checkbox"> Reduce motion</label></section><p class="status" id="status" role="status">Wheel motion is stopped.</p></main><script src="prototype.js"></script></body></html>
